      - key: AUTH_SERVICE_URL
        fromService:
          name: iotinel-auth
          type: web
          property: host
      - key: ELASTICSEARCH_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: MLFLOW_TRACKING_URI
        value: "/tmp/mlruns"
      - key: MLOPS_API_BASE
        value: "http://localhost:8088"
      - key: ALLOWED_ORIGINS
        value: ""

  - type: web
    name: iotinel-monitoring
