databases:
  - name: iotinel-db
    databaseName: iotinel
    user: iotinel
    plan: free

services:
  - type: web
    name: iotinel-auth
    runtime: docker
    dockerfilePath: ./app_web/backend/Dockerfile.auth
    dockerContext: ./app_web
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iotinel-db
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: ELASTICSEARCH_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: MLFLOW_TRACKING_URI
        value: "/tmp/mlruns"
      - key: MLOPS_API_BASE
        value: "http://localhost:8088"
      - key: ALLOWED_ORIGINS
        value: ""

  - type: web
    name: iotinel-detection
    runtime: docker
    dockerfilePath: ./app_web/backend/Dockerfile.detection
    dockerContext: ./app_web
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        fromService:
          name: iotinel-auth
          type: web
          envVarKey: JWT_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: iotinel-db
          property: connectionString
      - key: INTERNAL_SERVICE_TOKEN
        fromService:
          name: iotinel-auth
          type: web
          envVarKey: INTERNAL_SERVICE_TOKEN
      - key: AUTH_SERVICE_URL
        fromService:
          name: iotinel-auth
          type: web
          property: host
      - key: ELASTICSEARCH_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: MLFLOW_TRACKING_URI
        value: "/tmp/mlruns"
      - key: MLOPS_API_BASE
        value: "http://localhost:8088"
      - key: COHERE_API_KEY
        value: ""
      - key: ALLOWED_ORIGINS
        value: ""

  - type: web
    name: iotinel-training
    runtime: docker
    dockerfilePath: ./app_web/backend/Dockerfile.training
    dockerContext: ./app_web
