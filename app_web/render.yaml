          type: web
          property: host
      - key: TRAINING_SERVICE_URL
        fromService:
          name: iotinel-training
          type: web
          property: host
      - key: MONITORING_SERVICE_URL
        fromService:
          name: iotinel-monitoring
          type: web
          property: host
      - key: DASHBOARD_SERVICE_URL
        fromService:
          name: iotinel-dashboard
          type: web
          property: host
      - key: ADMIN_SERVICE_URL
        fromService:
          name: iotinel-admin
          type: web
          property: host
      - key: ANALYST_UI_URL
        value: ""
      - key: SCIENTIST_UI_URL
        value: ""
      - key: ADMIN_UI_URL
        value: ""
      - key: ELASTICSEARCH_URL
        value: ""
      - key: REDIS_URL
        value: ""
      - key: MLFLOW_TRACKING_URI
        value: "/tmp/mlruns"
      - key: MLOPS_API_BASE
        value: "http://localhost:8088"
      - key: ALLOWED_ORIGINS
        value: ""

  - type: web
    name: iotinel-analyst-ui
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: app_web/frontend/analyst
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: ""

  - type: web
    name: iotinel-scientist-ui
